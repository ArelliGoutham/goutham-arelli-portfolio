version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Group patch and minor updates together — safe to merge without manual review
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major version bumps are NOT grouped — each gets its own PR for individual assessment

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
